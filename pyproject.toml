[project]
name = "mimir-pm-bot"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    "aiogram==3.32.0",
    "alembic==1.20.1",
    "pydantic>=2,<3",
    "pyte>=0.8.2,<0.9",
    "sqlalchemy>=2,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=9,<10", "ruff", "mypy"]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E","F","I","UP","B","ASYNC"]
[tool.mypy]
strict = true
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel.force-include]
"prompts" = "mimir_pm_bot/defaults/prompts"
"config/mcp.toml" = "mimir_pm_bot/defaults/config/mcp.toml"
