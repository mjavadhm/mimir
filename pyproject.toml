[project]
name = "peyda-pm-bot"
version = "0.1.0"
description = "Durable Telegram ingest for the Peyda project-management bot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram==3.32.0",
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "pydantic>=2",
    "sqlalchemy[asyncio]>=2.0",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/peyda_pm_bot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["peyda_pm_bot", "tests"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
strict = true
mypy_path = "src"
packages = ["peyda_pm_bot"]
warn_return_any = true

# aiogram 3.32.0 and aiosqlite do not ship py.typed. The adapter narrows their values
# with isinstance before they enter application code.
[[tool.mypy.overrides]]
module = ["aiogram", "aiogram.*", "aiosqlite", "aiosqlite.*"]
ignore_missing_imports = true
